name: Zalo nhóm - tag người, ghi chú, nhắc hẹn, poll
name_en: "Zalo groups: mention people, notes, reminders, polls"
slug: zalo-group
version: 1.1.0
description: Tag ĐÚNG người trong nhóm Zalo (nói tên, Naota tự tìm ID Zalo thật), liệt kê thành viên, tạo, đọc và sửa ghi chú nhóm (giữ nguyên ghim), tạo nhắc hẹn và tạo poll, bằng chính tài khoản đã quét QR ở trang Kết nối. Bù đúng chỗ MCP chuẩn của zalo-agent-cli còn thiếu - nó chỉ có bảy tool và tool gửi tin chỉ nhận chữ.
description_en: "Mentions the RIGHT person in a Zalo group (say the name, Naota finds the real Zalo ID), lists members, creates, reads and edits group notes (keeping the pin), creates reminders and polls, using the very account you scanned on the Connections page. Fills exactly what the standard zalo-agent-cli MCP lacks: it has only seven tools and its send tool takes text only."
author: Naota
enabled: true
min_mode: full
tools:
  - zalo_group_members
  - zalo_send_mention
  - zalo_create_note
  - zalo_list_notes
  - zalo_edit_note
  - zalo_create_reminder
  - zalo_create_poll
hooks: []
