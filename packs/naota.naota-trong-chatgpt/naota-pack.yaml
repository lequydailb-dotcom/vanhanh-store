# Gói "Naota trong ChatGPT": chat trên chatgpt.com, ChatGPT gọi công cụ của Naota.
#
# Naota giữ mọi cuộc chat chung một nền tảng, nên tính năng này là gói tuỳ chọn. Ai cần thì cài,
# và việc cài là lựa chọn có chủ ý.
format: naota-pack
spec: 1

id: naota.naota-trong-chatgpt
version: 1.0.0

name:
  vi: Naota trong ChatGPT
  en: Naota in ChatGPT
description:
  vi: Chat trên chatgpt.com bằng gói ChatGPT của bạn, và ChatGPT tự gọi công cụ của Naota (số liệu, brain, nhắc lịch, Zalo). Cần Naota 1.0.0 trở lên, mật khẩu quản trị và tên miền https.
  en: Chat on chatgpt.com with your own ChatGPT plan while ChatGPT calls Naota's tools (numbers, brain, reminders, Zalo). Needs Naota 1.0.0 or newer, an admin password and an https domain.

author:
  name: Naota
license: MIT
homepage: https://github.com/vuongtex/naota-store/tree/main/packs/naota.naota-trong-chatgpt

# Cần `ctx.register_http` và `ctx.register_well_known` của lõi cho plugin.
compat:
  app: ">=1.0.0"

provides:
  plugins:
    - plugins/naota-trong-chatgpt
