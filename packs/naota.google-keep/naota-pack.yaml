format: naota-pack
spec: 1
id: naota.google-keep
version: 1.0.3
name: {vi: "Google Keep"}
description: {vi: "Đọc và sửa ghi chú Google Keep: tìm note, tạo note và danh sách việc, gắn nhãn, ghim, lưu trữ. LƯU Ý: Keep không có API chính chủ nên phải dùng master token có TOÀN QUYỀN tài khoản Google, không phải OAuth giới hạn phạm vi như Gmail hay Lịch. Naota chỉ thao tác được ghi chú, nhưng token thì mở cả tài khoản nếu bị lộ."}
author: {name: Naota}
license: MIT
homepage: "https://github.com/vuongtex/naota-store"
compat: {app: ">=1.0.0"}
provides:
  connectors: [connectors/google-keep.json]
